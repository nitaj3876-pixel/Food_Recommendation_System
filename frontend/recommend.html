<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommendations · Foodie</title>
<link rel="stylesheet" href="../css/style.css">
<script src="js/foodie-common.js"></script>
</head>
<body class="page-shell">

  <nav class="navbar">
    <div class="brand"><span class="emoji">🍔</span> Foodie</div>
    <div class="nav-links">
      <a href="home.html">Home</a>
      <a href="favorites.html">Favorites</a>
      <a href="history.html">History</a>
      <a href="profile.html">Profile</a>
    </div>
    <div class="nav-avatar" id="avatarInitial">U</div>
  </nav>

  <div class="page-body">
    <div class="container">
      <h1 class="page-title" id="pageTitle">Recommended for You</h1>
      <p class="page-sub" id="pageSub">Based on your preferences</p>
      <a href="recommend.html" class="helper-link" id="backLink" style="display:none; margin-bottom:16px;">← Back to my recommendations</a>

      <div class="chip-row" id="chipRow">
        <button class="chip active" data-diet="all">All</button>
        <button class="chip" data-diet="healthy">Healthy</button>
        <button class="chip" data-diet="vegetarian">Vegetarian</button>
        <button class="chip" data-diet="vegan">Vegan</button>
        <button class="chip" data-diet="high_protein">High Protein</button>
        <button class="chip" data-diet="low_carb">Low Carb</button>
      </div>

      <div class="food-grid cols-3" id="recGrid"></div>

      <div style="text-align:center; margin-top: 28px;">
        <button class="btn btn-outline" id="refreshBtn">↻ Refresh Recommendations</button>
      </div>
    </div>
  </div>

<script>
const token = localStorage.getItem('foodie_token');
if (!token) window.location.href = 'login.html';

const user = JSON.parse(localStorage.getItem('foodie_user') || '{}');
if (user.full_name) document.getElementById('avatarInitial').textContent = user.full_name.charAt(0).toUpperCase();

const params = new URLSearchParams(window.location.search);
const searchTerm = (params.get('search') || '').toLowerCase();
const relatedFoodId = params.get('food');
let currentDiet = 'all';

function foodCardHtml(food) {
  return `
    <a class="food-card" href="${relatedUrl(food)}">
      ${foodThumbHtml(food, "thumb")}
      <button class="heart-btn" data-id="${food.id}" onclick="event.preventDefault(); event.stopPropagation(); addFavorite(${food.id}, this);">♡</button>
      <div class="body">
        <div class="name">${food.name}</div>
        <div class="tag">${food.category}</div>
      </div>
    </a>`;
}

async function addFavorite(foodId, btn) {
  await fetch(`${API_BASE}/api/users/favorites/${foodId}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}` }
  });
  btn.classList.add('active');
  btn.textContent = '❤';
}

function renderGrid(foods, emptyMessage) {
  const grid = document.getElementById('recGrid');
  grid.innerHTML = foods.length
    ? foods.map(foodCardHtml).join('')
    : `<div class="empty-state"><h3>No matches found</h3><p>${emptyMessage}</p></div>`;
}

async function loadRecommendations() {
  const grid = document.getElementById('recGrid');
  grid.innerHTML = '';
  try {
    const res = await fetch(`${API_BASE}/api/foods/recommend/for-me?diet=${currentDiet}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
    let foods = await res.json();

    if (searchTerm) {
      foods = foods.filter(f => f.name.toLowerCase().includes(searchTerm));
    }
    renderGrid(foods, 'Try a different filter or search term.');
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><h3>Couldn't load recommendations</h3><p>Check that the backend server is running.</p></div>`;
  }
}

async function loadRelated(foodId) {
  const grid = document.getElementById('recGrid');
  document.getElementById('chipRow').style.display = 'none';
  document.getElementById('backLink').style.display = 'inline-block';
  try {
    // GET /{food_id} logs this view into history AND gives us the name for the heading
    const foodRes = await fetch(`${API_BASE}/api/foods/${foodId}`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (foodRes.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return; }
    const food = await foodRes.json();

    document.getElementById('pageTitle').textContent = `More like ${food.name}`;
    document.getElementById('pageSub').textContent = 'Similar dishes you might enjoy';

    // Tag/TF-IDF based similarity - finds dishes like THIS one, not just same category
    const relatedRes = await fetch(`${API_BASE}/api/foods/${foodId}/related`);
    const related = await relatedRes.json();
    renderGrid(related, 'No similar items yet - try adding a few more foods with matching tags.');
  } catch (err) {
    grid.innerHTML = `<div class="empty-state"><h3>Couldn't load this item</h3><p>Check that the backend server is running.</p></div>`;
  }
}

document.getElementById('chipRow').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentDiet = chip.dataset.diet;
  loadRecommendations();
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  if (relatedFoodId) loadRelated(relatedFoodId);
  else loadRecommendations();
});

if (relatedFoodId) {
  loadRelated(relatedFoodId);
} else {
  loadRecommendations();
}
</script>
</body>
</html>
